name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system OCR (optional path)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytesseract
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Offline benchmark
        run: python -m agent_core bench --offline
